services:
  master:
    build: ./master
    ports:
      - "0.0.0.0:8001:8001"
    environment:
      - REDIS_URL=redis://100.68.227.68:6379
      - SCHEDULER_STRATEGY=least_connections
      - HEARTBEAT_TIMEOUT_SECONDS=8
      - PROCESSING_STALE_SECONDS=45
      - MAX_ATTEMPTS=3
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gateway:
    build: ./gateway
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - REDIS_URL=redis://100.68.227.68:6379
      - REQUEST_TIMEOUT_SECONDS=120
    depends_on:
      - master

  # worker:
  #   build: ./worker
  #   environment:
  #     - OLLAMA_URL=http://host.docker.internal:11434
  #     - OLLAMA_MODEL=smollm:135m
  #     - HEARTBEAT_INTERVAL_SECONDS=2
  #     - HEARTBEAT_TTL_SECONDS=8
  #     - RESULT_TTL_SECONDS=300
  #     # R2 + optional RAG overrides: set in project-root .env
  #     - RAG_S3_ENDPOINT=${RAG_S3_ENDPOINT}
  #     - RAG_S3_ACCESS_KEY_ID=${RAG_S3_ACCESS_KEY_ID}
  #     - RAG_S3_SECRET_ACCESS_KEY=${RAG_S3_SECRET_ACCESS_KEY}
  #     - RAG_S3_BUCKET=${RAG_S3_BUCKET}
  #     - RAG_S3_PREFIX=${RAG_S3_PREFIX:-rag}
  #     - RAG_EMBED_MODEL=${RAG_EMBED_MODEL:-}
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

  worker_remote:
    build: ./worker
    environment:
      - REDIS_URL=${REDIS_URL}
      - OLLAMA_URL=${REMOTE_OLLAMA_URL}
      - OLLAMA_MODEL=smollm:135M
      - HEARTBEAT_INTERVAL_SECONDS=2
      - HEARTBEAT_TTL_SECONDS=8
      - RESULT_TTL_SECONDS=300
      - RAG_S3_ENDPOINT=${RAG_S3_ENDPOINT}
      - RAG_S3_ACCESS_KEY_ID=${RAG_S3_ACCESS_KEY_ID}
      - RAG_S3_SECRET_ACCESS_KEY=${RAG_S3_SECRET_ACCESS_KEY}
      - RAG_S3_BUCKET=${RAG_S3_BUCKET}
      - RAG_S3_PREFIX=${RAG_S3_PREFIX:-rag}
      - RAG_EMBED_MODEL=${RAG_EMBED_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"