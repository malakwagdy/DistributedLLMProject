services:
  
  master:
    build: ./master
    ports:
      - "0.0.0.0:8001:8001"
    environment:
      - REDIS_URL=redis://100.68.227.68:6379
      - SCHEDULER_STRATEGY=least_connections
      - HEARTBEAT_TIMEOUT_SECONDS=8
      - PROCESSING_STALE_SECONDS=45
      - MAX_ATTEMPTS=3
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gateway:
    build: ./gateway
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - REDIS_URL=redis://100.68.227.68:6379
      - REQUEST_TIMEOUT_SECONDS=120
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - master