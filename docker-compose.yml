services:
  redis:
    image: redis:alpine

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - redis

  worker:
    build: ./worker
    depends_on:
      - redis
    deploy:
      replicas: 3  # This creates 3 distributed worker nodes!
    extra_hosts:
      - "host.docker.internal:host-gateway"